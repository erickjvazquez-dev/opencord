name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (go build · vet · test + DB integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opencord
          POSTGRES_PASSWORD: opencord
          POSTGRES_DB: opencord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencord"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://opencord:opencord@localhost:5432/opencord?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...   # DB integration tests run when DATABASE_URL is set (above)

  web:
    name: web (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
